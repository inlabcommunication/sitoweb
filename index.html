<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: questi valori sono quelli della home; lo script di build
         (scripts/prerender.ts) li sostituisce per ogni pagina e il browser
         li aggiorna a ogni cambio pagina (src/seo). -->
    <title>InLab Communication Castellaneta | Agenzia di comunicazione</title>
    <meta name="description" content="Agenzia di comunicazione con sede a Castellaneta (TA): social media, video e reel, Meta Ads, siti web e branding per aziende in Puglia e non solo." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://sitoweb-beta.vercel.app/" />
    <meta name="theme-color" content="#1e1d1d" />
    <meta name="author" content="InLab Communication" />
    <meta name="geo.region" content="IT-TA" />
    <meta name="geo.placename" content="Castellaneta" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InLab Communication" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://sitoweb-beta.vercel.app/" />
    <meta property="og:title" content="InLab Communication Castellaneta | Agenzia di comunicazione" />
    <meta property="og:description" content="Agenzia di comunicazione con sede a Castellaneta (TA): social media, video e reel, Meta Ads, siti web e branding per aziende in Puglia e non solo." />
    <meta property="og:image" content="https://sitoweb-beta.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InLab Communication Castellaneta | Agenzia di comunicazione" />
    <meta name="twitter:description" content="Agenzia di comunicazione con sede a Castellaneta (TA): social media, video e reel, Meta Ads, siti web e branding per aziende in Puglia e non solo." />
    <meta name="twitter:image" content="https://sitoweb-beta.vercel.app/og-image.png" />

    <!-- Icone -->
    <!-- Logo InLab (da logo originale): favicon.ico anche per Google, che mostra l'icona nei risultati -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Font ospitati da noi (src/fonts.css): precaricati i due usati sopra la piega -->
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/bebas-neue-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/dm-sans-latin.woff2" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- Dati strutturati dell'agenzia (generati in build da src/seo/routes.ts) -->
    <script type="application/ld+json" data-seo="org">{}</script>
      <!-- Senza JavaScript (alcuni crawler, browser con JS disattivato) gli
         elementi animati resterebbero invisibili: li mostra solo in quel caso. -->
    <!-- Prima che il JavaScript parta (su telefoni lenti può volerci qualche
         secondo) gli elementi animati restano visibili; App.tsx aggiunge la
         classe "hy" dopo l'avvio e da lì le animazioni funzionano come prima.
         Della sezione a scorrimento della home si vede solo il primo testo
         (gli altri sono sovrapposti). -->
    <style>html:not(.hy) #root [style*="opacity:0"]:not(.sps-copy):not(.sps-head):not(.sps-glow):not(.orb-content):not(.md-fill):not(.md-label):not([style*="preserve-3d"]){opacity:1!important;transform:none!important;filter:none!important}html:not(.hy) #root .orb-content,html:not(.hy) #root .sps-copy:not(.sps-copy ~ .sps-copy){opacity:1!important;transform:none!important}</style>
    <noscript><style>#root [style*="opacity:0;transform"],#root [style$="opacity:0"]{opacity:1!important;transform:none!important}</style></noscript>
  </head>
  <body style="margin:0;background:#1e1d1d;color:#F0EDE6">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
